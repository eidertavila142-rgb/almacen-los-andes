<title>Almacén de Documentos</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6f8;--surface:#ffffff;--text:#1a2230;--muted:#667085;--line:#e3e6eb;
  --accent:#c8241b;--accent-weak:#fdeceb;--accent-text:#ffffff;--ink:#141414;--ink-2:#232323;--brand-red:#e23a2e;
  --danger:#b42318;--danger-weak:#fdecea;--ok:#067647;--ok-weak:#e6f4ec;--warn:#9a6700;--warn-weak:#fff4d6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;--surface:#1a2029;--text:#e7eaf0;--muted:#98a2b3;--line:#2b3340;
    --accent:#ff6b5e;--accent-weak:#3b1d1a;--accent-text:#1a0807;
    --danger:#f19a91;--danger-weak:#3a1e1c;--ok:#6fd0a0;--ok-weak:#16291f;--warn:#e8c26b;--warn-weak:#33290f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;--surface:#1a2029;--text:#e7eaf0;--muted:#98a2b3;--line:#2b3340;
  --accent:#ff6b5e;--accent-weak:#3b1d1a;--accent-text:#1a0807;
  --danger:#f19a91;--danger-weak:#3a1e1c;--ok:#6fd0a0;--ok-weak:#16291f;--warn:#e8c26b;--warn-weak:#33290f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
p.sub{color:var(--muted);margin:0 0 20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],input[type=password],input[type=search],select,textarea,input:not([type]){
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);outline:none}
input[type=file]{width:100%;padding:7px;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12px;color:var(--muted);font-weight:500}
label>input,label>select,label>textarea{margin-top:4px;color:var(--text);font-size:14px;font-weight:400}
.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;font-weight:400}
.chk input{width:auto;margin:0}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger-weak)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
.ico{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ico:hover{background:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted)}
.right{margin-left:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.danger{background:var(--danger-weak);color:var(--danger)}
.pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td .small{font-size:12px;color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.err{color:var(--danger);background:var(--danger-weak);padding:8px 10px;border-radius:6px;font-size:13px}
.notice{background:var(--warn-weak);color:var(--warn);padding:12px 14px;border-radius:8px;margin-bottom:16px;font-weight:500}
/* switch */
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(16px)}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:20px}
.logo{width:26px;height:26px;border-radius:6px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.logo svg{width:15px;height:15px;stroke:var(--accent-text)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{flex:1;background:none;border:0;padding:9px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
/* admin shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
aside nav{display:flex;flex-direction:column;gap:2px;flex:1}
aside nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
aside nav button:hover{background:var(--bg);color:var(--text)}
aside nav button.on{background:var(--accent-weak);color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-text);border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.aside-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
main{padding:28px 32px;max-width:1100px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.card-f{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg)}
.card-f .row{margin-bottom:8px}
.card-f input,.card-f textarea{background:var(--surface)}
.card-f .chk{margin-top:8px}
.group-h{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:6px 10px;font-size:12px;font-weight:600;border-radius:6px;margin-top:10px}
.urow{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);gap:10px}
.urow select{width:130px;padding:4px 6px;font-size:12px}
/* user area */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .brand{margin:0}
.top nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
.top nav button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.top nav button.on{background:var(--accent-weak);color:var(--accent)}
.page{padding:28px 24px;max-width:960px;margin:0 auto}
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:left;display:block;width:100%}
.folder:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.folder svg{width:30px;height:30px;stroke:var(--accent);margin-bottom:12px}
.folder b{display:block;font-size:15px;font-weight:600}
.folder span{color:var(--muted);font-size:12px}
.folder[disabled]{opacity:.5;cursor:not-allowed}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);width:100%;max-width:640px}
.modal.wide{max-width:860px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.search{position:relative;max-width:380px;margin:0 0 12px}
.search-row{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.search-row .search{flex:1;margin:0}
.mascot{width:76px;height:76px;flex:none;border-radius:14px;border:1px solid var(--line);background:#fff;object-fit:contain}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search input{padding-left:34px!important}
.preview{border:1px solid var(--line);border-radius:8px;margin-top:14px;background:var(--bg);overflow:hidden}
.preview iframe{width:100%;height:60vh;border:0;background:#fff;display:block}
.preview img{max-width:100%;display:block;margin:0 auto}
.doc-html{padding:20px 24px;background:#fff;color:#1a2230;max-height:60vh;overflow:auto;line-height:1.6}
.doc-html img{max-width:100%}
.doc-html table{min-width:0;width:auto}
.doc-html th,.doc-html td,.xl th,.xl td{border:1px solid #d0d5dd;padding:4px 8px;background:#fff;color:#1a2230;text-transform:none;letter-spacing:0;font-size:13px;font-weight:400}
.xl{overflow:auto;max-height:50vh;background:#fff;color:#1a2230}
.xl table{min-width:0;width:auto}
.xl td{white-space:nowrap}
.preview pre{margin:0;padding:14px;white-space:pre-wrap;max-height:60vh;overflow:auto;font-size:13px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;display:none;max-width:90vw}
[hidden]{display:none!important}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  aside nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  aside nav button{white-space:nowrap}
  main{padding:20px 16px}
  .grid2{grid-template-columns:1fr}
}

.logo{width:32px;height:32px;border-radius:0;background:none;display:inline-flex}

/* login */
.auth-card{border-top:5px solid var(--brand-red);position:relative;overflow:hidden}

.auth-logo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;text-align:center}
.auth-logo img{max-width:100%;height:auto;display:block;margin:0 auto}
.auth-title{text-align:center;font-weight:600;font-size:15px;margin-bottom:18px;letter-spacing:.01em}
/* barras negras (menú lateral y barra superior) */
aside,.top{background:var(--ink);border-color:var(--ink-2);color:#fff;border-bottom:3px solid var(--brand-red)}

aside .brand,.top .brand{color:#fff}
aside nav button,.top nav button{color:#c9c9c9}

aside nav button.on,.top nav button.on{background:var(--brand-red);color:#fff}
aside .badge{background:#fff;color:var(--ink)}
.aside-foot{border-top-color:#333}
.aside-foot .muted,.top .muted{color:#b5b5b5}
.aside-foot .link{color:#ff8f85}
.company{font-size:11px;color:#8d8d8d;margin-bottom:10px;line-height:1.35;padding-left:20px;background:var(--cow) no-repeat left 1px/14px auto}
.top .btn{background:transparent;border-color:#4a4a4a;color:#fff}
.top .btn:hover{background:var(--ink-2)}
/* detalles rojos */
h1{border-left:4px solid var(--brand-red);padding-left:10px}
th{border-bottom:2px solid var(--brand-red)}
.stat{border-top:3px solid var(--brand-red)}
.folder{position:relative;overflow:hidden}
.folder::after{content:"";position:absolute;right:-10px;bottom:-12px;width:84px;height:80px;background:var(--cow) no-repeat center/contain;opacity:.08;pointer-events:none}
.folder:hover::after{opacity:.16}
.empty::before{content:"";display:block;width:56px;height:54px;margin:0 auto 10px;background:var(--cow) no-repeat center/contain;opacity:.35}
.page::after,main::after{content:"Ganadería Industrial Los Andes, C.A.";display:block;margin-top:28px;padding-top:12px;padding-left:22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--cow) no-repeat left 12px/15px auto}
@media (max-width:820px){aside{border-right:0;border-bottom:3px solid var(--brand-red)}}

function save() {
  const now = snapNow(), old = SNAP; SNAP = now;

  const split = k => { const i = k.indexOf('|'); return [k.slice(0, i), k.slice(i + 1)]; };

const searchBox = (id, ph, img) => {
  const box = `<div class="search"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input type="search" data-search="${id}" placeholder="${ph}" aria-label="Buscar" autocomplete="off"></div>`;
  return img ? `<div class="search-row"><img class="mascot" src="${img}" alt="">${box}</div>` : box;
};
const NORES = n => `<tr class="nores" hidden><td colspan="${n}" class="empty">Sin resultados para tu búsqueda.</td></tr>`;
const docQ = d => esc(norm([d.title, d.fileName, visLabel(d), (d.depts || []).join(' '), ...(d.fields || []).flatMap(f => [f.t, f.d])].join(' ')));
document.addEventListener('input', e => {
  const t = e.target.closest('[data-search]'); if (!t) return;
  const tb = document.getElementById(t.dataset.search); if (!tb) return;
  const q = norm(t.value.trim()); let n = 0;
  $$('tr[data-q]', tb).forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) n++; });
  const nr = $('.nores', tb); if (nr) nr.hidden = n > 0;
});

/* ============ Modal / confirmación ============ */
let confirmCb = null;
function openModal(html) { $('#modal').innerHTML = `<div class="overlay" data-act="close">${html}</div>`; }
function closeModal() { $('#modal').innerHTML = ''; revokeUrl('modal'); }
function askConfirm(text, cb, label = 'Confirmar') {
  confirmCb = cb;
  openModal(`<div class="modal" style="max-width:420px"><div class="modal-b"><h2>${esc(text)}</h2></div><div class="modal-f"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="doconfirm">${esc(label)}</button></div></div>`);
}

/* ============ Render principal ============ */
function render() {
  const app = $('#app');
  if (!ui.user) { app.innerHTML = viewAuth(); return; }
  const u = cur(); if (!u) { ui.user = null; return render(); }
  app.innerHTML = u.role === 'admin' ? viewAdmin() : viewUser();
  if (u.role === 'admin' && ui.view === 'subir') initUpload();
}

/* ============ Autenticación ============ */
function viewAuth() {
  const login = ui.tab === 'login';
  return `<div class="auth"><div class="auth-card">
    <div class="auth-logo"><img src="${LOGO}" alt="Ganadería Industrial Los Andes, C.A."></div>
    <div class="auth-title">Almacén de Documentos</div>
    <div class="tabs"><button data-act="tab" data-v="login" class="${login ? 'on' : ''}">Iniciar sesión</button><button data-act="tab" data-v="reg" class="${!login ? 'on' : ''}">Crear usuario</button></div>
    ${ui.err ? `<div class="err" style="margin-bottom:12px">${esc(ui.err)}</div>` : ''}
    ${login ? `<form data-form="login" class="stack">
      <label>Usuario<input name="name" autocomplete="username" required></label>
      <label>Contraseña<input type="password" name="pass" autocomplete="current-password" required></label>
      <button class="btn primary" style="width:100%;padding:9px">Entrar</button>
      <div class="hint">Acceso inicial del administrador: <span class="mono">admin</span> / <span class="mono">admin123</span></div>
    </form>` : `<form data-form="reg" class="stack">
      <label>Nombre de usuario<input name="name" required></label>
      <label>Contraseña<input type="password" name="pass" required></label>
      <label>Departamento<select name="dept" required><option value="">Selecciona…</option>${S.depts.map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
      <button class="btn primary" style="width:100%;padding:9px">Crear usuario</button>
    </form>`}
  </div></div>`;
}

/* ============ Panel del administrador ============ */
function viewAdmin() {
  const unread = S.msgs.filter(m => !m.read).length;
  const nav = [['resumen','Resumen'],['docs','Documentos'],['subir','Subir documento'],['users','Usuarios'],['depts','Departamentos'],['trash','Papelera'],['archive','Archivo'],['log','Historial'],['msgs','Mensajes'],['cuenta','Mi cuenta']];
  const V = { resumen: vResumen, docs: vDocs, subir: vSubir, users: vUsers, depts: vDepts, trash: vTrash, archive: vArchive, log: vLog, msgs: vMsgs, cuenta: vCuenta };
  return `<div class="shell"><aside>
    <div class="brand">${I.logo} <span>Almacén</span></div>
    <nav>${nav.map(([k, l]) => `<button data-act="nav" data-v="${k}" class="${ui.view === k ? 'on' : ''}">${l}${k === 'msgs' && unread ? `<span class="badge">${unread}</span>` : ''}</button>`).join('')}</nav>
    <div class="aside-foot"><div class="company">Ganadería Industrial Los Andes, C.A.</div><div style="font-weight:600">${esc(cur().name)}</div><div class="muted" style="font-size:12px;margin-bottom:6px">Administrador</div><button class="link" data-act="logout">Cerrar sesión</button></div>
  </aside><main>${V[ui.view]()}</main></div>`;
}

function vResumen() {
  const active = S.docs.filter(d => d.status === 'active').length;
  const trash = S.docs.filter(d => d.status === 'trash').length;
  const unread = S.msgs.filter(m => !m.read).length;
  const recent = [...S.logs].reverse().slice(0, 8);
  return `<h1>Resumen</h1><p class="sub">Vista general del almacén.</p>
  <div class="stats">
    <div class="stat"><b>${active}</b><span>Documentos activos</span></div>
    <div class="stat"><b>${workers().length}</b><span>Usuarios</span></div>
    <div class="stat"><b>${trash}</b><span>En papelera</span></div>
    <div class="stat"><b>${unread}</b><span>Mensajes sin leer</span></div>
  </div>
  <div class="panel between">
    <div><h3>Horario laboral</h3><div class="muted" style="margin-top:2px">Al activar el bloqueo, ningún trabajador puede ver documentos. Al desactivarlo, cada uno recupera el acceso que tenía configurado.</div></div>
    <div class="row" style="flex:none"><span class="pill ${S.lockdown ? 'danger' : 'ok'}">${S.lockdown ? 'Acceso bloqueado' : 'Acceso normal'}</span>
      <label class="sw"><input type="checkbox" data-chg="lockdown" ${S.lockdown ? 'checked' : ''}><span></span></label></div>
  </div>
  <h2>Actividad reciente</h2>
  ${recent.length ? `<div class="tw"><table><thead><tr><th>Usuario</th><th>Acción</th><th>Documento</th><th>Fecha</th></tr></thead><tbody>${recent.map(l => `<tr><td>${esc(l.uname)}</td><td>${l.type === 'open' ? 'Apertura' : 'Descarga'}</td><td>${esc(l.title)}</td><td class="muted">${fmt(l.ts)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="tw"><div class="empty">Sin actividad todavía.</div></div>`}`;
}

function docVisCell(d) {
  if (d.vis === 'dept') return `<span class="pill">Departamento</span><div class="small">${esc((d.depts || []).join(', ') || '—')}</div>`;
  return `<span class="pill ${d.vis === 'private' ? 'warn' : ''}">${visLabel(d)}</span>`;
}

function vDocs() {
  const docs = S.docs.filter(d => d.status === 'active');
  return `<div class="between"><div><h1>Documentos</h1><p class="sub">Gestiona permisos, descarga y eliminación.</p></div><button class="btn primary" data-act="nav" data-v="subir">Subir documento</button></div>
  ${docs.length ? searchBox('tb_docs', 'Buscar documentos subidos…', MASCOT.admin) : ''}<div class="tw">${docs.length ? `<table><thead><tr><th>Documento</th><th>Compartido con</th><th>Con acceso</th><th>Descargar</th><th></th></tr></thead><tbody id="tb_docs">
  ${docs.map(d => `<tr data-q="${docQ(d)}">
    <td><b>${esc(d.title)}</b><div class="small">${esc(d.fileName)} · ${fmt(d.created)}</div></td>
    <td>${docVisCell(d)}</td>
    <td>${workers().filter(u => effective(d, u)).length} usuarios</td>
    <td><label class="sw"><input type="checkbox" data-chg="dl" data-id="${d.id}" ${canDl(d) ? 'checked' : ''}><span></span></label><div class="small" style="max-width:200px">${esc(dlScope(d))}</div></td>
    <td style="white-space:nowrap;text-align:right">
      <button class="btn sm" data-act="view" data-id="${d.id}">Ver</button>
      <button class="btn sm" data-act="docperm" data-id="${d.id}">Permisos</button>
      <button class="btn sm danger" data-act="totrash" data-id="${d.id}">Eliminar</button>
    </td></tr>`).join('')}${NORES(5)}</tbody></table>` : `<div class="empty">No hay documentos activos.</div>`}</div>`;
}

function vSubir() {
  return `<h1>Subir documento</h1><p class="sub">Solo el administrador puede cargar archivos (máx. 500 MB por archivo).</p>
  <div class="panel stack">
    <div class="grid2">
      <label>Archivo<input type="file" id="f_file"></label>
      <label>Título<input id="f_title" placeholder="Nombre visible del documento"></label>
    </div>
    <div id="f_prevwrap" hidden><label>Vista previa del archivo</label><div class="preview" id="f_prev"></div></div>
    <label>Compartir con<select id="f_vis">
      <option value="public">Público (todos los usuarios)</option>
      <option value="private">Privado (un solo trabajador)</option>
      <option value="dept">Departamento</option></select></label>
    <div id="f_priv" hidden><label>Trabajador<select id="f_user"><option value="">Selecciona…</option>${workers().map(u => `<option value="${u.id}">${esc(u.name)} · ${esc(u.dept)}</option>`).join('')}</select></label></div>
    <div id="f_dept" hidden><label>Departamentos</label><div class="row" style="flex-wrap:wrap;gap:6px 18px;margin-top:6px">${S.depts.map(d => `<label class="chk"><input type="checkbox" class="f_d" value="${esc(d)}"> ${esc(d)}</label>`).join('') || '<span class="muted">Crea departamentos primero.</span>'}</div></div>
    <label class="chk"><input type="checkbox" id="f_dl" checked> Permitir descargar</label><div class="muted" style="font-size:12px;margin-top:-6px">${DL_HINT}</div>
    <div class="sec-head"><div><h3>Información del documento</h3><div class="muted" style="font-size:12px">Añade recuadros con título y descripción. «Dejar fijo» los conserva en los siguientes documentos.</div></div>
      <button type="button" class="ico" id="addCard" title="Añadir recuadro">+</button></div>
    <div id="cards"></div>
    <div class="row"><button class="btn primary" id="f_submit">Subir documento</button></div>
  </div>`;
}

function cardHtml(c = {}) {
  return `<div class="card-f" ${c.id ? `data-fid="${c.id}"` : ''}>
    <div class="row"><input class="cf-t" placeholder="Título" value="${esc(c.t || '')}"><button type="button" class="ico" data-act="rmcard" title="Quitar recuadro">−</button></div>
    <textarea class="cf-d" placeholder="Descripción">${esc(c.d || '')}</textarea>
    <label class="chk"><input type="checkbox" class="cf-fix" ${c.id ? 'checked' : ''}> Dejar fijo para los demás documentos</label></div>`;
}

function initUpload() {
  $('#cards').innerHTML = S.fixed.map(cardHtml).join('');
  $('#addCard').onclick = () => $('#cards').insertAdjacentHTML('beforeend', cardHtml());
  const vis = $('#f_vis');
  vis.onchange = () => { $('#f_priv').hidden = vis.value !== 'private'; $('#f_dept').hidden = vis.value !== 'dept'; };
  $('#f_submit').onclick = submitUpload;
  let tok = 0;
  $('#f_file').onchange = async () => {
    revokeUrl('upload'); const f = $('#f_file').files[0], my = ++tok;
    $('#f_prevwrap').hidden = !f; if (!f) return;
    $('#f_prev').innerHTML = '<div class="empty">Generando vista previa…</div>';
    const html = await buildPreview(f, f.type || '', f.name, 'upload');
    if (my === tok) $('#f_prev').innerHTML = html;
  };
}

async function submitUpload() {
  revokeUrl('upload');
  const file = $('#f_file').files[0];
  const title = $('#f_title').value.trim() || (file ? file.name : '');
  const vis = $('#f_vis').value;
  if (!file) return toast('Selecciona un archivo');
  if (!title) return toast('Escribe un título');
  if (file.size > MAX_BYTES) return toast('El archivo supera 500 MB');
  const depts = $$('.f_d:checked').map(x => x.value);
  const userId = $('#f_user').value;
  if (vis === 'dept' && !depts.length) return toast('Selecciona al menos un departamento');
  if (vis === 'private' && !userId) return toast('Selecciona un trabajador');
  const cards = $$('#cards .card-f').map(el => ({
    fid: el.dataset.fid, t: $('.cf-t', el).value.trim(), d: $('.cf-d', el).value.trim(), fix: $('.cf-fix', el).checked
  })).filter(c => c.t || c.d);
  const btn = $('#f_submit'); btn.disabled = true; btn.textContent = 'Subiendo…';
  const doc = { id: uid(), title, fileName: file.name, mime: file.type || 'application/octet-stream', size: file.size,
    vis, depts: vis === 'dept' ? depts : [], perms: vis === 'private' ? { [userId]: 'allow' } : {},
    download: $('#f_dl').checked, fields: cards.map(c => ({ t: c.t, d: c.d })), created: Date.now(), status: 'active' };
  try { await idbPut(doc.id, file); }
  catch (e) { btn.disabled = false; btn.textContent = 'Subir documento'; return toast('No hay espacio suficiente en el navegador para este archivo'); }
  S.docs.push(doc);
  const prevFixed = S.fixed;
  S.fixed = cards.filter(c => c.fix).map(c => ({ id: c.fid || uid(), t: c.t, d: c.d }));
  if (save()) { toast('Documento subido'); ui.view = 'docs'; render(); }
  else { S.docs.pop(); S.fixed = prevFixed; idbDel(doc.id); btn.disabled = false; btn.textContent = 'Subir documento'; }
}

const myDocs = (u, vis) => S.docs.filter(d => d.vis === vis && canAccess(d, u));
const FOLDERS = u => [['public', 'Documentos públicos', 'Visibles para todos', I.globe], ['private', 'Mis documentos', 'Solo tú puedes verlos', I.lock], ['dept', 'Departamento: ' + u.dept, 'Compartidos con tu departamento', I.team]];

function uFolder() {
  const u = cur(), k = ui.uview.split(':')[1];
  const f = FOLDERS(u).find(x => x[0] === k); const docs = myDocs(u, k);
  return `<button class="link" data-act="unav" data-v="desk">← Escritorio</button><h1 style="margin-top:8px">${esc(f[1])}</h1><p class="sub">${f[2]}</p>

function uHistory() {
  const u = cur(); const seen = new Map();
  [...S.logs].reverse().filter(l => l.uid === u.id && l.type === 'open').forEach(l => { if (!seen.has(l.docId)) seen.set(l.docId, l); });

  return `<h1>Historial</h1><p class="sub">Documentos que has abierto y la fecha de apertura.</p>
  <div class="tw">${rows.length ? `<table><thead><tr><th>Documento</th><th>Fecha</th></tr></thead><tbody>${rows.map(l => `<tr><td><b>${esc(l.title)}</b></td><td class="muted">${fmt(l.ts)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">Aún no has abierto documentos.</div>`}</div>`;
}
function uContact() {
  return `<h1>Contactar al administrador</h1><p class="sub">Solicita un documento o envía un comentario. Solo el administrador lo recibe.</p>
  <form data-form="msg" class="panel stack" style="max-width:560px"><label>Asunto<input name="subject" placeholder="Ej.: Solicitud de documento" required></label>
  <label>Mensaje<textarea name="text" rows="5" required></textarea></label><div><button class="btn primary">Enviar</button></div></form>`;
}

/* ============ Visor de documentos ============ */
const urls = { modal: [], upload: [] };
function revokeUrl(scope) { (scope ? [scope] : Object.keys(urls)).forEach(s => { urls[s].forEach(u => URL.revokeObjectURL(u)); urls[s] = []; }); }
const objUrl = (blob, scope) => { const u = URL.createObjectURL(blob); urls[scope].push(u); return u; };

const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/';
const libs = {};
function loadLib(key, list, test) {
  if (test()) return Promise.resolve();
  if (libs[key]) return libs[key];
  libs[key] = new Promise((res, rej) => {
    let i = 0;
    const next = () => { if (i >= list.length) return rej(new Error('lib')); const s = document.createElement('script'); s.src = list[i++]; s.onload = () => test() ? res() : next(); s.onerror = next; document.head.appendChild(s); };
    next();
  });
  libs[key].catch(() => { delete libs[key]; });
  return libs[key];
}
const loadMammoth = () => loadLib('mammoth', [CDN + 'mammoth/1.6.0/mammoth.browser.min.js', CDN + 'mammoth/1.4.2/mammoth.browser.min.js'], () => window.mammoth);
const loadXlsx = () => loadLib('xlsx', [CDN + 'xlsx/0.18.5/xlsx.full.min.js'], () => window.XLSX);

function cleanHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => { if (/^on/i.test(a.name) || (/^(href|src|xlink:href|action)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name); });
    if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
  });
  return doc.body.innerHTML;
}
const MAX_PARSE = 25 * 1024 * 1024;
async function sheetsHtml(wb) {
  return wb.SheetNames.slice(0, 10).map(n => {
    const ws = wb.Sheets[n]; let cut = false;
    const rng = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    if (rng.e.r > 500) { rng.e.r = 500; ws['!ref'] = XLSX.utils.encode_range(rng); cut = true; }
    return `<h3 style="padding:10px 14px 4px;color:#1a2230">${esc(n)}</h3><div class="xl">${XLSX.utils.sheet_to_html(ws, { header: '', footer: '' })}</div>${cut ? '<div class="muted" style="padding:4px 14px;font-size:12px">Vista previa limitada a las primeras 500 filas.</div>' : ''}`;
  }).join('');
}

/* Vista previa para cualquier archivo que se suba (sin descargarlo) */
async function buildPreview(blob, mime, name, scope, allowDl = true) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const NA = msg => `<div class="empty">${msg || 'Vista previa no disponible para este tipo de archivo.'}</div>`;
  try {
    if (mime.startsWith('image/')) return `<img src="${objUrl(blob, scope)}" alt="" ${allowDl ? '' : 'draggable="false" oncontextmenu="return false"'}>`;
    if (mime === 'application/pdf' || ext === 'pdf') return `<iframe src="${objUrl(blob.type === 'application/pdf' ? blob : blob.slice(0, blob.size, 'application/pdf'), scope)}${allowDl ? '' : '#toolbar=0&navpanes=0'}" title="Vista previa"></iframe>`;
    if (mime.startsWith('video/')) return `<video controls controlsList="nodownload" disablePictureInPicture src="${objUrl(blob, scope)}" style="width:100%;max-height:60vh;background:#000;display:block"></video>`;
    if (mime.startsWith('audio/')) return `<div style="padding:24px"><audio controls controlsList="nodownload" src="${objUrl(blob, scope)}" style="width:100%"></audio></div>`;
    if (ext === 'docx') {
      if (blob.size > MAX_PARSE) return NA('El documento es demasiado grande para la vista previa (máx. 25 MB).');
      await loadMammoth();
      const r = await window.mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
      return `<div class="doc-html">${cleanHtml(r.value) || '<p>Documento vacío.</p>'}</div>`;
    }
    if (['xlsx', 'xlsm', 'xls', 'ods', 'csv'].includes(ext)) {
      if (blob.size > MAX_PARSE) return NA('La hoja de cálculo es demasiado grande para la vista previa (máx. 25 MB).');
      try {
        await loadXlsx();
        const wb = ext === 'csv' ? XLSX.read(await blob.slice(0, 2097152).text(), { type: 'string' }) : XLSX.read(await blob.arrayBuffer(), { type: 'array' });
        return cleanHtml(await sheetsHtml(wb));
      } catch (e) { if (ext !== 'csv') throw e; }
    }
    if (mime.startsWith('text/') || ['txt', 'md', 'csv', 'json', 'xml', 'log'].includes(ext)) {
      const t = await blob.slice(0, 1048576).text();
      return `<pre>${esc(t)}${blob.size > 1048576 ? '\n\n… vista previa limitada a 1 MB.' : ''}</pre>`;
    }
    if (['pptx', 'ppt', 'doc'].includes(ext)) return NA('Este formato no tiene vista previa. Súbelo como PDF para poder previsualizarlo.');
    return NA();
  } catch (e) { return NA('No se pudo generar la vista previa de este archivo.'); }
}
function legacyBlob(d) {
  const [hd, b] = d.data.split(','); const mime = (hd.match(/:(.*?);/) || [])[1] || 'application/octet-stream';
  const bin = atob(b), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function getBlob(d) {
  if (d.data) return legacyBlob(d); // documentos subidos con la versión anterior
  const b = await idbGet(d.id);
  if (!b) throw new Error('missing');
  return b;
}
function log(d, type) { const u = cur(); if (u.role === 'admin') return; S.logs.push({ id: uid(), uid: u.id, uname: u.name, docId: d.id, title: d.title, type, ts: Date.now() }); save(); }

async function openDoc(id, asAdmin) {
  const d = S.docs.find(x => x.id === id); const u = cur(); if (!d) return;
  if (!asAdmin && !canAccess(d, u)) { toast('No tienes acceso a este documento'); render(); return; }
  if (!asAdmin) log(d, 'open');
  let blob; try { blob = await getBlob(d); } catch (e) { toast('No se encontró el archivo en este navegador'); return; }
  revokeUrl('modal');
  const canDownload = asAdmin || (canDl(d) && userDl(u));
  const prev = await buildPreview(blob, d.mime, d.fileName, 'modal', canDownload);
  openModal(`<div class="modal wide" data-doc="${d.id}">
    <div class="modal-h"><div><h2 style="margin:0">${esc(d.title)}</h2><div class="muted" style="font-size:12px">${esc(d.fileName)}</div></div><button class="btn sm no-print" data-act="close">Cerrar</button></div>
    <div class="modal-b">
      ${d.fields.length ? `<div class="no-print" style="display:grid;gap:8px;margin-bottom:14px">${d.fields.map(f => `<div class="card-f" style="margin:0">${f.t ? `<b>${esc(f.t)}</b>` : ''}${f.d ? `<div class="muted" style="white-space:pre-wrap">${esc(f.d)}</div>` : ''}</div>`).join('')}</div>` : ''}
      <div class="row no-print">${canDownload ? `<button class="btn" data-act="download" data-id="${d.id}" data-admin="${asAdmin ? 1 : ''}">Descargar</button>` : '<span class="muted" style="font-size:12px">La descarga no está habilitada para este documento.</span>'}</div>
      <div class="preview">${prev}</div>
    </div></div>`);
}

/* ============ Acciones ============ */
const ACT = {
  tab: t => { ui.tab = t.dataset.v; ui.err = ''; render(); },
  logout: () => { SB.auth.signOut(); ui.user = null; ui.tab = 'login'; ui.err = ''; closeModal(); render(); },
  nav: t => { ui.view = t.dataset.v; render(); window.scrollTo(0, 0); },
  unav: t => { ui.uview = t.dataset.v; render(); },
  folder: t => { ui.uview = 'folder:' + t.dataset.v; render(); },
  close: (t, e) => { if (t.classList.contains('overlay') && e.target !== t) return; closeModal(); },
  doconfirm: () => { const cb = confirmCb; confirmCb = null; closeModal(); cb && cb(); },
  rmcard: t => { const c = t.closest('.card-f'); if (c.dataset.fid) { S.fixed = S.fixed.filter(f => f.id !== c.dataset.fid); save(); } c.remove(); },
  view: t => openDoc(t.dataset.id, true),
  open: t => openDoc(t.dataset.id, false),
  docperm: t => docPermModal(t.dataset.id, !!t.dataset.arch),
  userperm: t => userPermModal(t.dataset.id),
  totrash: t => askConfirm('¿Enviar este documento a la papelera?', () => { const d = S.docs.find(x => x.id === t.dataset.id); d.status = 'trash'; d.deleted = Date.now(); save(); toast('Enviado a la papelera'); render(); }, 'Enviar a papelera'),
  restore: t => { const d = S.docs.find(x => x.id === t.dataset.id); d.status = 'archive'; d.restored = Date.now(); save(); toast('Restaurado en el archivo'); render(); },
  purge: t => askConfirm('¿Eliminar definitivamente? Esta acción no se puede deshacer.', () => { idbDel(t.dataset.id); S.docs = S.docs.filter(x => x.id !== t.dataset.id); save(); render(); }, 'Eliminar definitivamente'),
  newuser: () => userForm(),
  edituser: t => userForm(S.users.find(x => x.id === t.dataset.id)),
  deluser: t => askConfirm('¿Eliminar este usuario?', () => { S.users = S.users.filter(x => x.id !== t.dataset.id); save(); render(); }, 'Eliminar'),
  renamedept: t => {
    const old = t.dataset.n;
    openModal(`<div class="modal" style="max-width:420px"><form data-form="rendept" data-old="${esc(old)}"><div class="modal-b"><label>Nuevo nombre<input name="n" value="${esc(old)}" required></label></div><div class="modal-f"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Guardar</button></div></form></div>`);
  },
  deldept: t => askConfirm('¿Eliminar este departamento?', () => { S.depts = S.depts.filter(x => x !== t.dataset.n); S.docs.forEach(d => d.depts = d.depts.filter(x => x !== t.dataset.n)); save(); render(); }, 'Eliminar'),
  readmsg: t => { S.msgs.find(m => m.id === t.dataset.id).read = true; save(); render(); },
  delmsg: t => { S.msgs = S.msgs.filter(m => m.id !== t.dataset.id); save(); render(); },
  saveperm: () => {
    const box = $('.modal[data-doc]'); const d = S.docs.find(x => x.id === box.dataset.doc);
    d.vis = $('#p_vis').value; d.download = $('#p_dl').checked;
    d.depts = d.vis === 'dept' ? $$('.p_d:checked').map(x => x.value) : d.depts;
    const perms = {}; $$('.p_sel').forEach(s => { if (s.value) perms[s.dataset.uid] = s.value; }); d.perms = perms;
    if (box.dataset.arch) d.status = 'active';
    save(); closeModal(); toast('Permisos guardados'); render();
  },
  saveuserperm: () => {
    const box = $('.modal[data-user]'); const id = box.dataset.user;
    const uu = S.users.find(x => x.id === id); if (uu) uu.download = $('#u_dl').checked;
    $$('.u_sel').forEach(s => { const d = S.docs.find(x => x.id === s.dataset.doc); d.perms = d.perms || {}; if (s.value) d.perms[id] = s.value; else delete d.perms[id]; });
    save(); closeModal(); toast('Permisos guardados'); render();
  },
  download: async t => {
    const d = S.docs.find(x => x.id === t.dataset.id); const u = cur();
    if (!t.dataset.admin && !canAccess(d, u)) return toast('Acceso suspendido');
    if (!t.dataset.admin && !(canDl(d) && userDl(u))) return toast('La descarga no está habilitada para ti en este documento');
    try {
      const blob = await getBlob(d);
      if (window.claude && typeof window.claude.use === 'function') {
        const dl = await window.claude.use('downloads');
        if (!dl) return toast('La descarga no está disponible en esta vista');
        await dl.save({ filename: d.fileName, data: blob });
      } else {
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = d.fileName; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      if (!t.dataset.admin) log(d, 'download');
    } catch (e) { if (e && e.code === 'rejected_extension') toast('Este tipo de archivo no puede descargarse desde aquí'); else if (e && e.code !== 'declined') toast('No se pudo descargar'); }
  }
};
const CHG = {
  lockdown: t => { S.lockdown = t.checked; save(); toast(S.lockdown ? 'Acceso bloqueado fuera de horario laboral' : 'Accesos restablecidos'); render(); },
  dl: t => { S.docs.find(d => d.id === t.dataset.id).download = t.checked; save(); toast(t.checked ? 'Descarga habilitada' : 'Descarga denegada'); render(); },
  logfilter: t => { ui.logUser = t.value; render(); }
};
const FORM = {
  login: async f => {
    const n = f.name.value.trim(), p = f.pass.value;
    const r = await SB.rpc('login_email', { n });
    const { error } = r.data ? await SB.auth.signInWithPassword({ email: r.data, password: p }) : { error: true };
    if (error) { ui.err = 'Usuario o contraseña incorrectos'; return render(); }
    await enter();
  },
  reg: async f => {
    const n = f.name.value.trim(), dep = f.dept.value, p = f.pass.value;
    if (!dep) { ui.err = 'Selecciona un departamento'; return render(); }
    if (p.length < 6) { ui.err = 'La contraseña debe tener al menos 6 caracteres'; return render(); }
    const { data, error } = await SB.auth.signUp({ email: EMAIL(n), password: p, options: { data: { name: n } } });
    if (error || !data.session) { ui.err = 'Ese nombre de usuario ya existe o no es válido'; return render(); }
    await enter();
    const u = cur();
    if (u && u.role !== 'admin') { S.msgs.push({ id: uid(), uid: u.id, uname: u.name, subject: 'Solicitud de departamento', text: 'Quiero pertenecer a: ' + dep, ts: Date.now(), read: false }); save(); toast('Un administrador te asignará tu departamento'); }
  },
  user: async f => {
    const id = f.dataset.id, n = f.name.value.trim(), e = $('#uerr');
    const bad = m => { e.textContent = m; e.hidden = false; };
    if (S.users.some(x => x.name.toLowerCase() === n.toLowerCase() && x.id !== id)) return bad('Ese nombre de usuario ya existe');
    if (id) {
      const u = S.users.find(x => x.id === id);
      if (u.role === 'admin' && f.role.value !== 'admin' && S.users.filter(x => x.role === 'admin').length === 1) return bad('Debe existir al menos un administrador');
      Object.assign(u, { name: n, dept: f.dept.value, role: f.role.value });
    } else {
      if (f.pass.value.length < 6) return bad('La contraseña debe tener al menos 6 caracteres');
      const tmp = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
      const { data, error } = await tmp.auth.signUp({ email: EMAIL(n), password: f.pass.value, options: { data: { name: n } } });
      if (error || !data.user) return bad('No se pudo crear el usuario (¿nombre repetido?)');
      S.users.push({ id: data.user.id, name: n, dept: f.dept.value, role: f.role.value, download: true });
    }
    save(); closeModal(); render();
  },
  cuenta: async f => {
    const u = cur(), err = m => { const e = $('#cerr'); e.textContent = m; e.hidden = false; };
    const n = f.name.value.trim(), np = f.pass.value;
    const me = (await SB.auth.getUser()).data.user;
    const chk = await SB.auth.signInWithPassword({ email: me.email, password: f.cur.value });
    if (chk.error) return err('La contraseña actual no es correcta');
    if (!n) return err('El nombre no puede estar vacío');
    if (S.users.some(x => x.id !== u.id && x.name.toLowerCase() === n.toLowerCase())) return err('Ese nombre de usuario ya existe');
    if (np && np !== f.pass2.value) return err('Las contraseñas nuevas no coinciden');
    if (np && np.length < 6) return err('La contraseña nueva debe tener al menos 6 caracteres');
    if (np) { const r = await SB.auth.updateUser({ password: np }); if (r.error) return err(r.error.message); }
    u.name = n; save(); toast('Cuenta actualizada'); render();
  },
  dept: f => { const n = f.n.value.trim(); if (!n || S.depts.some(d => d.toLowerCase() === n.toLowerCase())) return toast('Nombre vacío o repetido'); S.depts.push(n); save(); render(); },
  rendept: f => {
    const old = f.dataset.old, n = f.n.value.trim();
    if (!n || (n !== old && S.depts.some(d => d.toLowerCase() === n.toLowerCase()))) return toast('Nombre vacío o repetido');
    S.depts = S.depts.map(d => d === old ? n : d); S.users.forEach(u => { if (u.dept === old) u.dept = n; }); S.docs.forEach(d => d.depts = d.depts.map(x => x === old ? n : x));
    save(); closeModal(); render();
  },
  msg: f => { const u = cur(); S.msgs.push({ id: uid(), uid: u.id, uname: u.name, subject: f.subject.value.trim(), text: f.text.value.trim(), ts: Date.now(), read: false }); save(); toast('Mensaje enviado al administrador'); ui.uview = 'desk'; render(); }
};

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
function submitForm(f) {
  if (f.reportValidity && !f.reportValidity()) return;
  try { FORM[f.dataset.form](f); }
  catch (err) { console.error(err); ui.user = null; toast('Error: ' + (err && err.message ? err.message : err)); }
}
/* El botón envía el formulario directamente (funciona aunque el navegador o la vista previa bloqueen el envío nativo) */
document.addEventListener('click', e => {
  const b = e.target.closest('form[data-form] button:not([type=button])');
  if (!b || !b.form) return;
  e.preventDefault(); submitForm(b.form);
}, true);
document.addEventListener('submit', e => { const t = e.target.closest('[data-form]'); if (t) { e.preventDefault(); submitForm(t); } });

(async () => { try { await enter(); } catch (e) { console.error(e); render(); } })();
</script>
